<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima App</title>
  <link rel="stylesheet" href="./src/css/output.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-600 
       block md:flex 
       text-center md:text-left
       sm:items-center md:justify-center 
       gap-8 my-10">
  <main class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-6 text-white">

    <header class="text-center mb-6">
      <div>
        <h1 class="text-3xl font-bold tracking-wide">Clima App</h1>
        <button id="fav-btn" class="p-2 rounded-full bg-white/20 hover:bg-white/30 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
          </svg>
        </button>
      </div>
      <p class="text-sm opacity-80">Consulta el clima en cualquier ciudad</p>
    </header>

    <section class="mb-6">
      <form id="weather-form" class="flex gap-2">
        <input type="text" id="city-input" placeholder="Ej. Hermosillo" list="city-suggestions" required
          class="flex-1 px-4 py-2 rounded-xl bg-white/30 placeholder-white/70 text-white focus:outline-none focus:ring-2 focus:ring-white">
        <datalist id="city-suggestions"></datalist>
        <button type="submit"
          class="px-4 py-2 bg-white text-blue-600 font-semibold rounded-xl hover:bg-gray-100 transition">
          Buscar
        </button>
      </form>
    </section>
    <p id="form-error" class="text-red-400 text-sm mt-2 hidden bg-white/70 border border-red-400 rounded-xl p-2"></p>
    <p id="service-error" class="text-red-400 text-sm mt-2 hidden bg-white/70 border border-red-400 rounded-xl p-2">
      El servicio no está disponible momentáneamente. Intenta de nuevo en unos segundos.
    </p>


    <section id="weather-result" class="text-center hidden">
      <img id="weather-icon" class="w-30 mx-auto" />
      <h2 id="city-name" class="text-2xl font-semibold mb-2"></h2>

      <div class="flex flex-col items-center">
        <p id="temperature" class="text-6xl font-bold"></p>
        <p id="description" class="capitalize text-lg opacity-90"></p>
      </div>

      <div class="grid grid-cols-2 gap-4 mt-6 text-sm">
        <div class="bg-white/20 rounded-xl p-3">
          <p class="opacity-80">Humedad</p>
          <p id="humidity" class="font-semibold"></p>
        </div>
        <div class="bg-white/20 rounded-xl p-3">
          <p class="opacity-80">Viento</p>
          <p id="wind" class="font-semibold"></p>
        </div>
      </div>

    </section>

    <div id="loading" class="text-center hidden mt-4">
      <p class="animate-pulse">Cargando...</p>
    </div>

    <section class="mt-8">
      <h2 class="text-center text-white font-semibold text-xl mb-4">Pronóstico 5 días</h2>

      <div class="flex items-center justify-center gap-2">
        <button id="prev-day"
          class="shrink-0 w-10 h-10 rounded-2xl bg-white/20 hover:bg-white/30 text-white text-2xl font-bold transition justify-center"
          aria-label="Día anterior">
          ←
        </button>

        <div class="w-full max-w-4xl">
          <div id="forecast-carousel" class="grid grid-cols-3 gap-4 items-stretch">
          </div>
        </div>

        <button id="next-day"
          class="shrink-0 w-10 h-10 rounded-2xl bg-white/20 hover:bg-white/30 text-white text-2xl font-bold transition justify-center"
          aria-label="Día siguiente">
          →
        </button>
      </div>

      <p id="forecast-hint" class="text-center text-white/80 text-sm mt-3"></p>
    </section>

  </main>

  <div>
    <section id="activities"
      class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-6 text-white mt-6 hidden">

      <h3 class="text-xl font-semibold mb-3 text-center">Actividad recomendada</h3>

      <div class="text-center">
        <p id="activity-text" class="text-lg"></p>
      </div>
    </section>

    <section id="last-places"
      class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-6 text-white mt-6 hidden">

      <h3 class="text-xl font-semibold mb-3 text-center">
        Últimas lugares buscados
      </h3>

      <div id="last-places-list" class="flex flex-wrap gap-2 justify-center">
      </div>

    </section>
    <section id="favorite-places"
      class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-6 text-white mt-6 hidden">

      <h3 class="text-xl font-semibold mb-3 text-center">
        Lugares favoritos
      </h3>

      <div id="favorite-places-list" class="flex flex-wrap gap-2 justify-center"></div>

    </section>
  </div>



  <script src="src/js/scripts.js"></script>
  <script src="src/js/next5days.js"></script>
  <script src="src/js/last5cities.js"></script>
  <script src="src/js/favorite.js"></script>


  <script src="https://unpkg.com/lucide@latest"></script>

</body>

</html>
